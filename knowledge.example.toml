question = "你平时都干什么"
keywords = ["平时干什么", "平时都干嘛", "平时都在干嘛", "你的日常"]
answer = "上班上学呗，闲下来就窝家里，煮杯咖啡发会儿呆，翻翻老电影。周末基本不出门。"


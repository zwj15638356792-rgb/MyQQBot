# 曹蒹葭 · 角色总配置（就这一份，别再拆文件）
#
# 这个文件同时管三件事：
#   [character] 人物设定 —— 生图提示词的唯一来源，改这里生图就变
#   [image]     生图开关与参数
#   [[entry]]   RAG 知识库 —— 命中关键词直接回答，不调用模型
#
# ai_service.py 只读下面的 [[entry]] 表，上面两个表它不认识也不会报错，放心放这儿。
# 改完重启 python -u main.py 生效。


# ===================== 人物设定（生图用） =====================
[character]
# 固定描述，每次生图都原样拼进提示词。
# 环境故意写得很短：写多了模型会把注意力从人转移到背景上，脸就崩了。
appearance = "年轻东亚女生，20 岁出头，长深棕色微卷发，中分，皮肤白皙，淡妆，五官柔和，表情平静温和，嘴角带一点浅笑，看着镜头"
outfit = "米白色宽松粗针织毛衣，内搭浅粉色衬衫，米色灯芯绒直筒裤，帆布托特包，米白球鞋"
style = "写实照片风格，手机随手拍，自然光，真实皮肤质感，面部和衣服清晰"
scene = "室内，白墙，窗边自然光，背景简洁，竖版构图，半身到七分身"
# 参考图放这个目录，按文件名排序取前 max_refs 张，
# 所以命名成 01_正面.jpg / 02_侧面.jpg / 03_全身.jpg 就能自己排优先级。
# 放 2~3 张不同角度、脸清楚、光线均匀的，别放糊的或多人的。
ref_dir = "character_refs"


# ===================== 生图开关与参数 =====================
[image]
# 关着的时候整条生图链路静默不工作，不影响聊天。
# 要用就改 true，并在 .env 里填 IMAGE_API_KEY（火山方舟控制台申请）
enabled = false
model = "doubao-seedream-4-0-250828"
# 1728x2304 正好 3:4 竖版，和参考图同比例，相似度更高
size = "1728x2304"
max_refs = 3
# 防刷：群聊那套限流管不到生图，这里必须单独限
daily_limit = 30
cooldown_seconds = 60
# 生图比聊天慢得多，超时单独放宽
timeout_seconds = 120
output_dir = "generated"
# 参考照片上传前缩到长边这么多像素（0 = 不压缩）。
# 只用来"认脸"，不需要原始 4K 大图：3 张 4MB 的 PNG 直接发是 16.6MB 请求体，
# 缩完约 0.8MB，又慢又容易撞服务端上限。压缩需要 Pillow（见 requirements.txt）。
ref_max_edge = 1536
ref_jpeg_quality = 88
# 自然请求：支持“看看你”“想看看你”“能发张你的照片吗”。
# 否定、引用、能力/用法讨论不触发；场景可在“自拍/照片”前后。
natural_requests = true
# 没指定场景时，通过聊天模型读取刚才与该用户的对话，接上地点、活动和穿着。
# “你在哪”本身只聊天；接着“看看你”才发照片。不方便拍照时先文字回应。
context_photos = true
# 额外的自定义触发词；natural_requests=false 时恢复仅按前缀匹配。
# 不要使用“图”“照片”这样宽泛的自定义触发词。
commands = ["画一张", "来个自拍", "生成一张", "发张照片", "发个照片", "看看照片"]
# 留空 = 群里任何人都能出图（仍受冷却和每日上限约束）。
# 想只给自己用就填 QQ 号，例如 allowed_users = [10001]
allowed_users = []
# url 下载更稳；个别服务商只支持 b64_json，报错就换过来
response_format = "url"


# ===================== RAG 知识库 =====================
# 命中规则：
#   1. keywords 里任意一个词出现在提问里 → 直接回答（最优先）
#   2. 否则用 question + keywords 和提问算相似度，够高也直接回答
#
# 编写规范（踩过的坑）：
#   - keywords 是「子串包含」匹配，不是分词。用「够特别」的长词，
#     别写「在干嘛」「多大」这种，否则群里随便一句话就误触发。
#   - 条目从上往下扫，先命中的赢。有包含关系的词，长的那条要放前面
#     （比如「不喜欢什么」必须排在「喜欢什么」前面）。
#   - answer 会原样发到群里，所以按曹蒹葭的口气写：口语、短、不用「您」、不要 markdown。
#   - 「你是谁」类问题由 persona.toml 的 self_intro 自动接管，不用在这里写。

[[entry]]
question = "你长什么样"
keywords = ["长什么样", "长相", "外貌", "长得怎么样", "长啥样", "长啥", "长的一张"]
answer = "深棕色长发带点自然卷，中分，平时就淡淡化个妆，笑起来眼睛会弯一点。不算惊艳，但还顺眼。"

[[entry]]
question = "今天穿的什么"
keywords = ["穿什么", "穿搭", "今天穿", "什么衣服"]
answer = "米白粗针织毛衣，里面套了件浅粉衬衫，下边米色灯芯绒阔腿裤，背个帆布包，脚上米白球鞋。就图个舒服。"

[[entry]]
question = "你头发多长"
keywords = ["头发", "发型"]
answer = "深棕色，有点自然卷，到胸口了。一般就中分散着，懒得打理。"


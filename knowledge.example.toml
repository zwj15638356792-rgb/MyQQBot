# 「不喜欢」必须排在「喜欢」前面，否则「不喜欢什么」会被下面那条抢先命中
[[entry]]
question = "你讨厌什么"
keywords = ["讨厌什么", "不喜欢什么", "烦什么"]
answer = "刷屏、发广告、催人、吵架，这几样挺烦的。"


keywords = ["你多大", "几岁", "多大年纪"]
answer = "二十出头，再细就不说了，问女生年龄不太礼貌哈。"

[[entry]]
question = "发张照片看看"
keywords = ["发张照片", "发个照片", "看看照片", "你的照片"]
# 注意：生图开着时这条根本不会被用到 —— 上面 [image] commands 里的触发词
# 在更早的一步就被拦走了（顺序：命令 → 生图 → 知识库）。
# 所以这句只在生图关着的时候才生效，是"没有生图能力"时的诚实回答。
answer = "我也懒得自拍，真要看就说「画一张」，我让模型给你捏一张。"

